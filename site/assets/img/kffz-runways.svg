<svg xmlns="http://www.w3.org/2000/svg" viewBox="53 57 300 280" role="img"
     aria-labelledby="kffz-title kffz-desc">
  <title id="kffz-title">Falcon Field Airport (KFFZ) runway layout</title>
  <desc id="kffz-desc">Two parallel runways oriented 040/220 magnetic: 4R/22L,
    the 5,100-foot main runway, and 4L/22R, a 3,800-foot parallel.</desc>
  <g transform="rotate(-40 200 200)">
    <!-- connecting taxiway, simplified -->
    <path d="M104 238 L104 186 L296 186 L296 162" fill="none" stroke="currentColor"
          stroke-width="2.4" opacity=".28" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 4L/22R — north parallel, 3,800 ft -->
    <rect x="126" y="149" width="156" height="12" rx="1.5" fill="currentColor" opacity=".78"/>
    <line x1="136" y1="155" x2="272" y2="155" stroke="#fff" stroke-width="1.3"
          stroke-dasharray="8 7" opacity=".85"/>

    <!-- 4R/22L — main runway, 5,100 ft -->
    <rect x="92" y="230" width="216" height="15" rx="1.5" fill="currentColor"/>
    <line x1="104" y1="237.5" x2="296" y2="237.5" stroke="#fff" stroke-width="1.5"
          stroke-dasharray="10 8" opacity=".9"/>

    <!-- Thresholds. Runway 4 is entered from the southwest end, 22 from the
         northeast, so the numbers sit on opposite ends. Counter-rotated to stay
         upright once the group rotation is applied. -->
    <g font-family="Helvetica Neue, Arial, sans-serif" font-weight="700"
       fill="currentColor" font-size="12" opacity=".7">
      <text x="80"  y="241" text-anchor="end"
            transform="rotate(40 80 241)">4R</text>
      <text x="320" y="241" text-anchor="start"
            transform="rotate(40 320 241)">22L</text>
      <text x="116" y="159" text-anchor="end" font-size="10.5" opacity=".8"
            transform="rotate(40 116 159)">4L</text>
      <text x="292" y="159" text-anchor="start" font-size="10.5" opacity=".8"
            transform="rotate(40 292 159)">22R</text>
    </g>
  </g>
</svg>
